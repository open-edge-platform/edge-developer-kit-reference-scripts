# Auto-reply and maintainer reminder for newly opened issues
name: "Issue Bot"

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage new issue
    runs-on: ubuntu-latest
    permissions:
      issues: write # comment on and assign the new issue
    steps:
      - name: Comment triage request and assign maintainer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue_number = context.issue.number;

            const body = [
              "Thank you for raising the issue on the edge-developer-kit GitHub.",
              "The issue is currently being assigned to an Intel representative.",
              "",
              "Please help fill in the following information:",
              "- Kernel version",
              "- Platform",
              "- OS version",
              "- BKC or samples used"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

            // addAssignees triggers GitHub's built-in assignment notification email
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              assignees: [
                "syazaath",
                "jelyoussefi",
                "weithchoong",
                "chunsheong",
              ],
            });
