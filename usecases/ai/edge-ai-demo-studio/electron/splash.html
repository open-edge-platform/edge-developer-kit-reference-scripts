<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Demo Studio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0b0c10;
      background-image: radial-gradient(ellipse 60% 50% at 50% 38%, rgba(0, 70, 200, 0.12) 0%, transparent 70%);
      color: #fff;
      overflow: hidden;
      animation: pageIn 0.6s ease-out both;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ---- Fade-in keyframes ---- */
    @keyframes pageIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Logo ---- */
    .logo-wrap {
      animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .logo-wrap svg {
      width: 88px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(0, 113, 197, 0.35));
    }

    /* ---- Title ---- */
    .title {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    /* ---- Progress section ---- */
    .progress-section {
      width: 72%;
      margin-top: 40px;
      animation: riseIn 0.6s ease-out 0.35s both;
    }

    #progress-label {
      display: block;
      font-size: 11.5px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.48);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    #progress-container {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg, #0046c8 0%, #0071c5 50%, #00a3e0 100%);
      box-shadow: 0 0 10px rgba(0, 113, 197, 0.5), 0 0 3px rgba(0, 113, 197, 0.3);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    #progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 100%
      );
      animation: shimmer 1.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #progress-percent {
      display: block;
      margin-top: 8px;
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Log accordion ---- */
    .log-ticker-wrap {
      width: 72%;
      position: relative;
      margin-top: 14px;
      animation: riseIn 0.6s ease-out 0.45s both;
    }

    .log-accordion {
      position: relative;
    }

    .log-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      height: 18px;
      background: none;
      border: none;
      border-radius: 2px;
      padding: 0;
      cursor: pointer;
      outline: none;
      -webkit-app-region: no-drag;
    }

    .log-summary:focus-visible {
      outline: 1px solid rgba(0, 113, 197, 0.5);
      outline-offset: 2px;
    }

    #log-ticker {
      flex: 1 1 0;
      min-width: 0;
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 10px;
      line-height: 18px;
      color: rgba(255, 255, 255, 0.27);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    #log-ticker.is-fading {
      opacity: 0;
    }

    .log-chevron {
      flex-shrink: 0;
      width: 9px;
      height: 6px;
      color: rgba(255, 255, 255, 0.2);
      transition: transform 0.25s ease, color 0.15s ease;
    }

    .log-accordion.is-open .log-chevron {
      transform: rotate(180deg);
      color: rgba(255, 255, 255, 0.35);
    }

    .log-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 0;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(10, 12, 18, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s ease,
                  opacity 0.25s ease;
      opacity: 0;
      z-index: 10;
    }

    .log-accordion.is-open .log-panel {
      max-height: 60px;
      opacity: 1;
      border-color: rgba(0, 70, 200, 0.25);
    }

    .log-panel-inner {
      height: 60px;
      overflow-y: auto;
      padding: 6px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }

    .log-panel-inner::-webkit-scrollbar {
      width: 3px;
    }
    .log-panel-inner::-webkit-scrollbar-track {
      background: transparent;
    }
    .log-panel-inner::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    .log-line {
      display: block;
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 9.5px;
      line-height: 14px;
      color: rgba(255, 255, 255, 0.4);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-line:last-child {
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>

  <!-- Intel logo (white variant, inline SVG) -->
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 30">

    </svg>
  </div>

  <div class="title">Edge AI Demo Studio</div>

  <div class="progress-section">
    <span id="progress-label">Preparing...</span>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <span id="progress-percent">0%</span>
  </div>

  <div class="log-ticker-wrap">
    <div class="log-accordion" id="log-accordion">
      <button class="log-summary" id="log-summary" aria-expanded="false" aria-controls="log-panel">
        <span id="log-ticker"></span>
        <svg class="log-chevron" viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polyline points="1,1 5,5 9,1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="log-panel" id="log-panel" role="log" aria-live="polite" aria-label="Installation log">
        <div class="log-panel-inner" id="log-panel-inner"></div>
      </div>
    </div>
  </div>

  <script>
    function updateProgress(status, progress) {
      document.getElementById('progress-label').textContent = status;
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('progress-percent').textContent = `${Math.round(progress)}%`;
    }
  </script>
  <script src="splash.js"></script>
</body>
</html>
