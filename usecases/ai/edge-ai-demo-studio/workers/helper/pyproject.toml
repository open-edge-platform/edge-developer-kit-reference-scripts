    "openvino>=2025.4.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "pytorch-triton-xpu==3.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
