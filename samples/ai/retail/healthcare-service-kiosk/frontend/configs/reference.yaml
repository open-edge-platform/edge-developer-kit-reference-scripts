# --- API ---------------------------------------------------------------------
api:
  base_url: /api

# --- Terminal mode -----------------------------------------------------------
terminal:
  mode: chat

# --- Modules (unset runs every part; ids in healthcare-service-kiosk/docs/modules.md) ------
#modules:
#  disabled: [feedback, healthqa]
#  only: [checkin, directions, doctors, bill]

# --- Country & language ------------------------------------------------------
#country:
#  pack: malaysia
#locale:
#  language: en

# --- Local service timing and fee tuning -------------------------------------
mock:
  currency: MYR
  processing_fee: 2
  latency_ms: 0
  # Demo: every specialist books same-day visits at any hour of a day they consult (records.ts).
  clinics_always_open: false
  identity:
    read_ms: 2800
    scan_ms: 2300
    citizen: 1

# --- ID card reader (PC/SC / NFC) --------------------------------------------
nfc:
  simulate: never

# --- Receipt printer (prints the patient card and appointment slip) ----------
# enabled: false hides every Print button, the browser's included. Driver off
# leaves Print to the browser. escpos: an ESC/POS thermal printer; device
# `usb` finds the first USB one, or give a device path or tcp://host:9100.
#printer:
#  enabled: true
#  driver: escpos
#  device: usb

# --- Payload CMS (patient registry persisted in db.sqlite) -------------------
# A blank admin_password is generated into config.yaml on the first run, and a
# blank payload_secret into .payload-secret beside the database on the first boot.
cms:
  kiosk_key: dev-kiosk-key
  payload_secret:
  database_url: file:./db.sqlite
  database_adapter: sqlite
  admin_email: admin@demo.local
  admin_password:

# --- Document analysis (the LLM verdict on an uploaded document) -------------
llm:
  mock: false
  base_url: http://127.0.0.1:8080/api/text-generation@kiosk-llm/v1
  model: llamacpp:unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
  timeout_ms: 120000
  extra_body:
    chat_template_kwargs:
      enable_thinking: true

# --- OCR ---------------------------------------------------------------------
ocr:
  base_url: http://127.0.0.1:8080/api/ocr@ocr
  health_path: /healthcheck

# --- Face recognition (the identity step's face check) -----------------------
face:
  base_url: http://127.0.0.1:8080/api/face-recognition@face-recognition
  health_path: /healthcheck
  require_match: true

# --- Voice: speech-to-text + text-to-speech (assistant kiosk only) -----------
voice:
  stt:
    base_url: http://127.0.0.1:8080/api/speech-to-text@kiosk-stt/v1
    health_path: /../healthcheck
  tts:
    base_url: http://127.0.0.1:8080/api/text-to-speech@kiosk-tts-en/v1
    health_path: /../healthcheck
    voice: af_heart
  # The chat's lip-synced assistant (Wav2Lip, deployment.json); blank: no avatar.
  avatar:
    base_url: http://127.0.0.1:8080/api/lipsync@kiosk-avatar/v1
    health_path: /../healthcheck
  # Spoken-language detection (docs/i18n.md): Whisper names each utterance's
  # language and the chat follows the citizen into any language listed here.
  # Kokoro speaks the first eight on voice.tts; Malay, Indonesian, Vietnamese
  # and Tamil speak on their own studio instances (text-to-speech-<code>,
  # deployment.json). A blank voice is the language's default voice
  # (docs/configuration.md#spoken-languages-chat-mode); `voice@instance` picks
  # another one.
  languages:
    en: af_heart
    es: ef_dora
    fr: ff_siwis
    hi: hf_alpha
    it: if_sara
    ja: jf_alpha
    pt: pf_dora
    zh: zf_xiaobei
    ms:   # Malaya: Shafiqah Idayu
    id:   # Pocket TTS: female_1
    vi:   # VieNeu-TTS: Trúc Ly
    ta:   # Fastspeech2-HS: tamil_female
  wait_for_speech: false
  barge_in: true

# --- SMS, email and clinic notifications -------------------------------------
notify:
  driver: outbox
  webhook_url:

# --- Supporting documents ----------------------------------------------------
documents:
  source: scanner
  uploads_dir: ../assets/pdf
  mocks_dir:

  # --- Scanner ---
  scanner:
    mode: Color
    source: Adf-duplex
    args: --page-auto=yes --multifeed-detection Stop --blank-page-skip=yes
    simulate: never
