[project]
name = "paddleocr"
version = "0.1.0"
description = "PaddleOCR FastAPI worker (PP-OCRv5/v3 + PaddleOCR-VL) on OpenVINO"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # Use opencv-python (not headless) so it works on Windows desktop too.
    "opencv-python>=4.10",
    "numpy>=1.24,<2.2",
    "pillow>=12.3.0",
    "openvino>=2025.2",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "requests>=2.31",
    "tqdm>=4.66",
    "torch>=2.12.1",
    "torchvision>=0.26.0",
    "triton-xpu==3.7.1",
    "nncf>=2.18.0",
    "huggingface-hub>=0.32.4",
    "modelscope>=1.26.0",
    "sentencepiece>=0.2.1",
    "einops>=0.8.1",
    "protobuf>=4.25",
    "accelerate>=0.30",
    # Used by the vendored ov_paddleocr_vl helper for NNCF INT8 calibration.
    "datasets>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
triton-xpu = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv]
# Intel XPU torch wheels exist for Linux and Windows only (no macOS).
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
