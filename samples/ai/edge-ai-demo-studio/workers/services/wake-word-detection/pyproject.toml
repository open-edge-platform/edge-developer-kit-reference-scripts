# Outside the workers/ uv workspace (own uv.lock and .venv): openwakeword needs
# tflite-runtime, which has no wheels past cp311, so this project stays on Python 3.11.
[project]
name = "wake-word-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "worker-common",
  "model-downloader",
  "fastapi[standard]>=0.120.1",
  "websockets>=12.0",
  "openwakeword>=0.6.0",
  "sounddevice>=0.5.3",
  "sqlmodel>=0.0.24",
  "protobuf==6.33.5",
]

[tool.uv.sources]
worker-common = { path = "../../common", editable = true }
model-downloader = { path = "../../common/downloader", editable = true }
