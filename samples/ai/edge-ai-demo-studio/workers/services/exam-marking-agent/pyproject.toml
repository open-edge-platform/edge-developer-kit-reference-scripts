[project]
name = "exam-marking-agent"
version = "0.1.0"
description = "ReAct AI agent HTTP server for exam result analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "fastapi[standard]>=0.120.1",
    "uvicorn>=0.35.0",
    "llama-index-core>=0.12.0",
    "llama-index-llms-openai-like>=0.4.0",
    "watchdog>=4.0.0",
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "defusedxml>=0.7.1",
    "pyjwt>=2.14.0",
    "banks>=2.5.1",
    "multidict>=6.9.1",
    "urllib3>=2.8.0",
    "nltk>=3.10.3",
    "cryptography>=50.0.0",
    "mcp>=2.2.0",
    "tinytag>=2.3.0",
]

[tool.uv.sources]
# Not a workspace member, so the shared library comes in by path.
worker-common = { path = "../../common", editable = true }
