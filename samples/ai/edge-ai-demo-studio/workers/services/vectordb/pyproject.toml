[project]
name = "vectordb-worker"
version = "0.3.0"
description = "Vector DB storage worker for Edge AI Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "fastapi[standard]>=0.120.1",
    "cohere>=5.18.0",
    "numpy>=2.1",
    "faiss-cpu==1.11.0",
    "langchain-classic>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=1.0.0a4",
    "langchain-cohere>=0.5.0",
    "langchain-community>=0.3.31",
    "unstructured>=0.18.3",
    "pypdf>=6.21.4",
    "filelock>=3.20",
    "sqlmodel>=0.0.24",
    # pgvector backend: PostgreSQL client, embedded PostgreSQL 16 + pgvector (pgserver), and
    # what the upstream OEP document-ingestion pipeline imports (utils/oep_upstream.py).
    "langchain-postgres>=0.0.16",
    "psycopg[binary,pool]>=3.2.3",
    "sqlalchemy>=2.0",
    "pgserver>=0.1.4",
    "pydantic-settings>=2.6.1",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "tiktoken>=0.7",
]

[tool.uv]
# unstructured (through 0.27) caps filelock <4, but 4.2.1 is the first release fixing
# CVE-2026-112940. 4.0 changed only SoftReadWriteLock; unstructured uses the plain FileLock.
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.sources]
worker-common = { path = "../../common", editable = true }
