[project]
name = "video-generation"
version = "0.1.0"
description = "Text- and image-to-video with Wan2.1 / Wan2.2 on OpenVINO (GPU, CPU) or PyTorch (XPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "model-downloader",
    "accelerate>=1.12.0",
    "diffusers>=0.40.0",
    # Wan's prompt cleaning (diffusers' WanPipeline does the same).
    "ftfy>=6.3.1",
    "nncf>=3.1.0",
    "numpy>=2.1",
    "openvino==2026.4.1",
    # VACE's pose maps: warping crops for DWPose and drawing the skeletons.
    "opencv-python>=4.11.0.86",
    "pillow>=13.0.0",
    "python-multipart>=0.0.22",
    "torch==2.15.0",
    "transformers>=5.5.0",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
