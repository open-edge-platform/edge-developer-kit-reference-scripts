[project]
name = "diarization"
version = "0.1.0"
description = "Speaker diarization worker using pyannote.audio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common[audio]",
    "model-downloader",
    "fastapi[all]>=0.128.0",
    "uvicorn>=0.32.1",
    "pyannote-audio>=4.0.7",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "numpy>=2.1",
    "huggingface-hub>=0.27.0",
    "modelscope>=1.34.0",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
