[project]
name = "lipsync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "model-downloader",
    "aiortc==1.14.0",
    "diffusers>=0.40.0",
    "fastapi[standard]>=0.120.1",
    "huggingface-hub>=0.35.1",
    "librosa==0.11.0",
    "modelscope>=1.34.0",
    "nncf>=3.1.0",
    "numpy>=2.1",
    "openai>=1.83.0",
    "opencv-python>=4.11.0.86",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "resampy>=0.4.3",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
    "uvicorn>=0.34.3",
    "websockets>=15.0.1",
    "openvino==2026.2.1",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
