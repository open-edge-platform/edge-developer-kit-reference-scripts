[project]
name = "paddleocr"
version = "0.1.0"
description = "PaddleOCR FastAPI worker (PP-OCRv5/v3 + PaddleOCR-VL) on OpenVINO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "model-downloader",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # Use opencv-python (not headless) so it works on Windows desktop too.
    "opencv-python>=4.10",
    "numpy>=2.1",
    "pillow>=13.0.0",
    "openvino==2026.2.1",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "requests>=2.31",
    "tqdm>=4.66",
    # Reads the dictionary from the PP-OCRv5 ONNX language packs' inference.yml.
    "pyyaml>=6.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "nncf>=2.18.0",
    # Declared so the workspace lock owns the version (the vendored VL helper imports it); never
    # `uv pip install` it in start.sh, which desyncs the shared venv.
    "transformers>=5.15.1",
    "huggingface-hub>=0.32.4",
    "modelscope>=1.26.0",
    "sentencepiece>=0.2.1",
    "einops>=0.8.1",
    "protobuf>=4.25",
    # Used by the vendored ov_paddleocr_vl helper for NNCF INT8 calibration.
    "datasets>=3.0",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
