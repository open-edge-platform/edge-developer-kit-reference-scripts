[project]
name = "pipertts"
version = "0.1.0"
description = "Piper TTS worker (Multilingual) with OpenVINO acceleration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common[audio]",
    "model-downloader",
    "fastapi[standard]>=0.120.1",
    "piper-tts>=1.4.0",
    "openvino==2026.2.1",
    "numpy>=2.1",
    "modelscope>=1.34.0",
    "huggingface-hub>=0.20.0",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
