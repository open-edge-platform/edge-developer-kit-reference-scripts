[project]
name = "fastspeech2hstts"
version = "0.1.0"
description = "Fastspeech2_HS (IIT Madras) Tamil worker on OpenVINO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common[audio]",
    "model-downloader",
    "fastapi[standard]>=0.120.1",
    # Numbers to Tamil words, as upstream's text front end does.
    "indic-num2words==1.3.2",
    "numpy>=2.1",
    "openvino==2026.2.1",
    "pyyaml>=6.0.2",
    # Loads the checkpoints for the first start's OpenVINO export only.
    "torch==2.13.0",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
