[project]
name = "kokoro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common[audio]",
    "model-downloader",
    "fastapi[standard]>=0.120.1",
    "huggingface-hub[hf-xet]>=0.35.1",
    "loguru>=0.7.3",
    "misaki[en,zh]==0.9.4",
    # The spaCy model misaki's English G2P loads; if missing, misaki tries to install it on first
    # use with pip/uv, which the worker env lacks ("No package installer found" on Windows).
    "en-core-web-sm",
    # misaki[ja] without pyopenjtalk (source-only C++ build Windows can't compile; Kokoro's G2P never
    # calls it and main.py stubs its import), and unidic-lite instead of unidic's 770 MB download.
    "fugashi>=1.5.2",
    "jaconv>=0.5.0",
    "mojimoji>=0.0.13",
    "unidic-lite>=1.0.8",
    "modelscope>=1.34.0",
    "numpy>=2.1",
    "openvino==2026.2.1",
    "psutil>=7.1.0",
    "pydantic>=2.11.9",
    "torch==2.13.0",
    "transformers>=4.56.2",
]

[tool.uv.sources]
worker-common = { workspace = true }
model-downloader = { workspace = true }
torch = { index = "pytorch" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
