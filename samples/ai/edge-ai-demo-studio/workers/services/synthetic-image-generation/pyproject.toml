[project]
name = "synthetic-image-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "worker-common",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.50.1",
    "certifi>=2026.2.25",
    "diffusers>=0.40.0",
    "fastapi[all]>=0.135.1",
    "idna>=3.11",
    "markupsafe>=2.1.5",
    "openvino==2026.2.1",
    "requests>=2.33.0",
    "pillow>=13.0.0",
    "torch==2.13.0",
    "transformers>=5.5.0",
    "ultralytics>=8.4.19",
    "urllib3>=2.6.3",
    "uvicorn>=0.41.0",
    "setuptools>=81.0.0"
]

[tool.uv.sources]
worker-common = { workspace = true }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
