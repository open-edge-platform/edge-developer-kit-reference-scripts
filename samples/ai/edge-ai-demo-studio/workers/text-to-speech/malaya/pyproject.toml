[project]
name = "malayatts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.120.1",
    "malaya",
    "malaya-speech",
    "markupsafe==2.1.5",
    "modelscope>=1.34.0",
    "psutil>=7.1.0",
    "pydub>=0.25.1",
    "pysastrawi>=1.2.0",
    "pytorch-triton-xpu>=3.5.0 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "soundfile>=0.12.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

[tool.uv.sources]
malaya-speech = { git = "https://github.com/mesolitica/malaya-speech" }
malaya = { git = "https://github.com/mesolitica/malaya.git" }
torch = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorch-triton-xpu = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
