[project]
name = "vectordb-worker"
version = "0.2.0"
description = "Vector DB storage worker for Edge AI Studio"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and Web Framework
    "fastapi[standard]>=0.120.1",
    "openai>=1.99.9",
    "cohere>=5.18.0",
    "numpy==2.1.0",
    # Vector Database and Search
    "faiss-cpu==1.11.0",
    # LangChain Ecosystem
    "langchain>=1.0.0",
    "langchain-classic>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=1.0.0a4",
    "langchain-cohere>=0.5.0",
    "langchain-community>=0.3.31",
    # Document Processing
    "unstructured>=0.18.3",
    "pypdf>=6.6.2",
    "filelock==3.20.3",
    # Database and Modeling
    "sqlmodel>=0.0.24",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
