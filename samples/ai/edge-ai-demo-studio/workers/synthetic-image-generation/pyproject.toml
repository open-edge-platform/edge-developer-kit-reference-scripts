[project]
name = "synthetic-image-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.12.0",
    "bitsandbytes>=0.49.2",
    "certifi>=2026.2.25",
    "diffusers>=0.38.0",
    "fastapi[all]>=0.135.1",
    "idna>=3.11",
    "markupsafe==3.0.2",
    "openvino==2026.0.0",
    "requests>=2.33.0",
    "pillow>=12.2.0",
    "torch>=2.12.0",
    "transformers==5.5.0",
    "ultralytics==8.4.19",
    "urllib3>=2.6.3",
    "uvicorn>=0.41.0",
    "setuptools>=81.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[tool.uv.sources]
certifi = { index = "pypi" }
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
idna = { index = "pypi" }
requests = { index = "pypi" }
setuptools = { index = "pypi" }
urllib3 = { index = "pypi" }
pillow = { index = "pypi" }
torch = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pytorch-triton-xpu = [
  { index = "pytorch-xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
