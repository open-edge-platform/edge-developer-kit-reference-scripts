#
# The optimum-cli environment `ovms --pull` converts Qwen/Qwen3-ASR-* with (EXPORT_PROFILES in
# model_downloader/ovms/env.py). Only the openvino-dev-samples/optimum-intel fork exports it, and it
# needs transformers 5.13 (<5.14), which the optimum-intel 2.2.0 in common/ovms-export (OVMS's own
# requirements) caps below 5.6: hence a second environment, provisioned on demand by the worker that
# serves such a model.
#
# The fork is vendored at a pinned commit through workers/upstream.json into
# ./thirdparty/optimum-intel and taken by path. optimum-intel-version.patch fixes its version:
# upstream's setup.py appends `git rev-parse HEAD` of the enclosing repository, i.e. this one's.
#
# Outside the workspace, and upstream's code: the fork's own requirements decide the versions. Pinned
# on top only openvino / openvino-tokenizers at the OVMS release, which loads the tokenizer IR they
# write, and transformers to the release that has Qwen3-ASR. torch comes from the CPU index.

[project]
name = "ovms-export-qwen3-asr"
version = "0.1.0"
description = "optimum-cli environment used by OpenVINO Model Server to convert Qwen3-ASR during ovms --pull"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openvino==2026.4.1",
    "openvino-tokenizers==2026.4.1.0",
    # The vendored fork (2.1.0.dev0 at the pinned commit); it requires
    # optimum~=2.2.0 and transformers>=4.45,<5.14.
    "optimum-intel[openvino]",
    # First release with the HF-native Qwen3-ASR architecture, and the fork's ceiling.
    "transformers>=5.13.1,<5.14",
    "safetensors>=0.8.0",
    "torch",
    "torchvision",
    "accelerate",
    "einops",
    "pillow>=13.0.0",
    "requests",
    "sentencepiece",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
optimum-intel = { path = "thirdparty/optimum-intel" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
