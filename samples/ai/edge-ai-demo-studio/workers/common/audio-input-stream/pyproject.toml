#
# Live-microphone pseudo-streaming library: a WebSocket handler that VAD-segments int16 PCM into
# utterances for the host worker's own transcription callback.
#
# silero-vad's torch/torchaudio requirements resolve to the workspace root's XPU overrides, so no
# torch source is declared here. The VAD runs on CPU with silero-vad's TorchScript model.

[project]
name = "audio-input-stream"
version = "0.1.0"
description = "Pseudo-streaming gateway library: VAD-segments live mic audio into utterances for a host worker to transcribe in-process"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "silero-vad>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_input_stream"]
