#
# Installed into common/ovms-export only. The .pth lands in site-packages, where every interpreter
# start of that venv imports the module (see its docstring).

[project]
name = "ovms-export-compat"
version = "0.1.0"
description = "Import-time fixes for the optimum-intel release common/ovms-export pins"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ovms_export_compat.py", "ovms_export_compat.pth"]

[tool.uv]
# A path dependency is rebuilt only when a cache key changes; the default is pyproject.toml alone.
cache-keys = [{ file = "pyproject.toml" }, { file = "ovms_export_compat.py" }, { file = "ovms_export_compat.pth" }]
