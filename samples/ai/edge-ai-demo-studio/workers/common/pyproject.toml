[project]
name = "worker-common"
version = "0.1.0"
description = "Shared runtime helpers for Edge AI Studio workers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "psutil>=7.1.0",
    "uvicorn>=0.32.1",
]

[project.optional-dependencies]
# For workers that decode uploads or export non-WAV speech; worker_common.audio itself only needs ffmpeg.
audio = [
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_common"]
