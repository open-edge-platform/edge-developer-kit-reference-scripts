[project]
name = "frame-generation"
version = "0.1.0"
description = "RIFE video frame interpolation (frame generation) service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=13.0.0",
    "fastapi[standard]>=0.120.1",
    "huggingface-hub>=0.35.1",
    "modelscope>=1.34.0",
    "numpy>=2.2.6",
    "openvino>=2026.2.1",
    "python-multipart>=0.0.22",
    "safetensors>=0.4.5",
    "torch>=2.11.0",
    "uvicorn>=0.34.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
