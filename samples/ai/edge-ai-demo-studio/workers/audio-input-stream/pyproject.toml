[project]
name = "audio-input-stream"
version = "0.1.0"
description = "Pseudo-streaming gateway library: VAD-segments live mic audio into utterances for a host worker to transcribe in-process"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.120.1",
    "numpy>=1.26.0",
    "silero-vad>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_input_stream"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
