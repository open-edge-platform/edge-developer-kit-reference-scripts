# Fully simulated kiosk profile — no physical peripherals, no AI workers required.

api:
  base_url: /api

terminal:
  mode: chat

session:
  restart_ms: 30000
  idle_ms: 60000

mock:
  currency: MYR
  processing_fee: 2
  latency_ms: 0
  identity:
    read_ms: 800
    scan_ms: 800
    # Matches the mock documents generated by `npm run mocks:gen`.
    citizen: 1

nfc:
  gesture: tap
  driver: mock
  simulate: always

cms:
  kiosk_key: dev-kiosk-key
  payload_secret:
  database_url: file:./db.sqlite
  admin_email: admin@demo.local

llm:
  mock: true
  mock_verdict: match

# OCR, face, STT and TTS are left unconfigured — absent base URLs disable those workers.
face:
  require_match: false

voice:
  hands_free: false
  read_aloud: false
  wait_for_speech: false
  barge_in: false

documents:
  source: mock
  require_verification: false
  uploads_dir: ../assets/pdf
  mocks_dir: ../assets/mocks/citizens/4-hao-rahman/good
  scanner:
    driver: mock
    simulate: always
