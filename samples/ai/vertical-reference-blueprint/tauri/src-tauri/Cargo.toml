[package]
name = "kiosk-desktop"
version = "0.1.0"
description = "Vertical Reference Blueprint desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Process groups: the shell must stop the whole stack it starts, not just the
# script it spawned.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
