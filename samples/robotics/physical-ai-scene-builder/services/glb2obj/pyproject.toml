[project]
name = "glb2obj"
version = "0.1.0"
description = "Converts a GLB mesh into OBJ + MTL + texture files for the obj2mjcf pipeline."
# Upper bound: a fresh uv picks the newest Python it can; 3.13 is what this was tested on.
requires-python = ">=3.12,<3.14"
dependencies = ["trimesh==5.1.1", "numpy==2.5.4", "pillow==13.0.0"]

# This project is a single script invoked by `uv run`, not a distributable library.
[tool.uv]
package = false
