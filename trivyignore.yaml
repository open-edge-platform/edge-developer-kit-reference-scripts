vulnerabilities:
  - id: CVE-2025-48068
    statement: Information exposure in Next.js dev server due to lack of origin verification, it only affect when using (npm run dev). Our project is not using it. https://github.com/intel-innersource/applications.platforms.network-and-edge-developer-kits/security/dependabot/78

  - id: GHSA-wrw7-89jp-8q8g
    statement: |
      The project currently includes two `glib` major versions in `Cargo.lock`:
      `glib 0.20.x` (app-level) and `glib 0.18.x` pulled transitively via the GTK/WebKit stack
      (`gtk 0.18.x`, `webkit2gtk 2.0.1`, `gio 0.18.x`, etc.) used by Tauri/Wry on Linux.
      Upstream crates have not fully migrated to the `glib 0.20.x` chain yet, so removing
      `glib 0.18.x` is temporarily infeasible without breaking the GUI stack. We will
      reevaluate and lift to a single `glib 0.20.x` when Tauri/Wry/GTK/WebKit crates publish
      compatible releases. This ignore documents the transient state to resolve Trivy conflict.
